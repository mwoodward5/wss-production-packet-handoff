<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Woodward Software Service</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap");
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#030711; color:#fbfbf6; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:
        radial-gradient(circle at 78% 12%, rgba(55,223,255,.22), transparent 28rem),
        radial-gradient(circle at 18% 78%, rgba(143,82,255,.18), transparent 24rem),
        linear-gradient(135deg,#030711,#061626 54%,#05040c); }
      body:before { content:""; position:fixed; inset:0; pointer-events:none; background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size:64px 64px; mask-image:linear-gradient(to bottom, black, transparent 82%); }
      main { position:relative; width:min(960px, calc(100% - 40px)); padding:56px; border:1px solid rgba(255,255,255,.16); border-radius:34px; background:linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035)); box-shadow:0 35px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter:blur(22px); overflow:hidden; }
      main:after { content:""; position:absolute; inset:auto -20% -42% 35%; height:260px; background:radial-gradient(circle, rgba(55,223,255,.18), transparent 70%); transform:rotate(-8deg); }
      .eyebrow { display:inline-flex; gap:9px; align-items:center; padding:9px 14px; border:1px solid rgba(55,223,255,.35); border-radius:999px; color:#6feaff; background:rgba(55,223,255,.1); font-family:"JetBrains Mono", monospace; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
      .dot { width:8px; height:8px; border-radius:999px; background:#52ffbc; box-shadow:0 0 18px rgba(82,255,188,.95); }
      h1 { margin:22px 0 16px; max-width:780px; font-family:"Instrument Serif", serif; font-size:clamp(62px,9vw,122px); font-weight:400; line-height:.84; letter-spacing:-.045em; }
      p { color:#c6d3e4; font-size:18px; line-height:1.7; max-width:760px; }
      a { color:#72eaff; font-weight:800; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:32px; position:relative; z-index:2; }
      .grid a { display:block; padding:18px; border:1px solid rgba(255,255,255,.13); border-radius:20px; background:rgba(1,7,18,.48); color:#f8fbff; text-decoration:none; box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
      .fine { margin-top:24px; font-family:"JetBrains Mono", monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#8393a9; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow"><span class="dot"></span> Private operations service</div>
      <h1>Service online.</h1>
      <p>
        This secure service supports Woodward Software business operations.
        Operator tools and customer data require authorized access.
      </p>
      <div class="grid">
        <a href="/api/health">Check service health</a>
      </div>
      <p class="fine">Restricted system. Authorized access only.</p>
    </main>
  </body>
</html>
