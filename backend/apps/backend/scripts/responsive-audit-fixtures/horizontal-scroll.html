<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizontal scroll defects — responsive-audit fixture</title>
  <!--
    FIXTURE: horizontal-scroll.html
    The CRITICAL overflow case. A desktop-locked layout shipped to phones:
    an oversized fixed-width comparison table, a hard body min-width, and a
    pricing grid that only fits above 1280px. The self-test asserts these
    surface as CRITICAL horizontal-scroll issues at 390px (exit-code-1
    territory).
  -->
  <style>
    body {
      margin: 0;
      min-width: 1200px;          /* CRITICAL at 1024 / 768 / 390 */
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      color: #111827;
      background-color: #ffffff;
    }

    .page {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 20px;
    }

    h1 { font-size: 2.5rem; margin: 32px 0 16px; }

    .comparison-table {
      width: 1600px;              /* CRITICAL at every canonical width */
      border-collapse: collapse;
    }

    .comparison-table th, .comparison-table td {
      border: 1px solid #d1d5db;
      padding: 10px 14px;
      text-align: left;
    }

    .pricing-grid { display: flex; gap: 18px; }

    /* Desktop-only grid sized for big monitors, active from 1024px up —
       CRITICAL at exactly 1024px (1100 > 1024), fine at 1280 / 1440. */
    @media (min-width: 1024px) {
      .pricing-grid { width: 1100px; }
      .pricing-grid .plan { flex: 0 0 340px; }
    }

    .plan {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
    }

    .plan h2 { font-size: 1.25rem; margin: 0 0 8px; }
    .plan p { margin: 0; color: #374151; background-color: #ffffff; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Plan comparison</h1>

    <table class="comparison-table">
      <thead>
        <tr><th>Feature</th><th>Basic</th><th>Standard</th><th>Pro</th><th>Enterprise</th><th>Government</th><th>Municipal</th></tr>
      </thead>
      <tbody>
        <tr><td>Response window</td><td>48h</td><td>24h</td><td>8h</td><td>4h</td><td>2h</td><td>1h</td></tr>
        <tr><td>Inspections / yr</td><td>1</td><td>2</td><td>4</td><td>8</td><td>12</td><td>24</td></tr>
      </tbody>
    </table>

    <div class="pricing-grid">
      <div class="plan"><h2>Basic</h2><p>Annual checkup and priority dispatch.</p></div>
      <div class="plan"><h2>Standard</h2><p>Two inspections and tune-ups included.</p></div>
      <div class="plan"><h2>Pro</h2><p>Full coverage with same-day labor.</p></div>
    </div>
  </div>

  <img src="/img/plans.png" alt="Plan overview chart" width="900" height="420">
</body>
</html>
