<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Calm clinical treatment room with soft daylight">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#0b1615"/><stop offset="0.55" stop-color="#152e2b"/><stop offset="1" stop-color="#1f4641"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#8fded4" stop-opacity="0.85"/><stop offset="1" stop-color="#8fded4" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1f4641"/><stop offset="1" stop-color="#071010"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<circle cx="1180" cy="250" r="230" fill="url(#glow)" filter="url(#soft)" opacity="0.75"/>
<rect y="540" width="1600" height="460" fill="url(#ground)"/>
<g fill="none" stroke="#120a14" stroke-opacity="0.32" stroke-width="8">
<circle cx="800" cy="520" r="120"/><circle cx="800" cy="520" r="190"/><circle cx="800" cy="520" r="260"/><circle cx="800" cy="520" r="330"/><circle cx="800" cy="520" r="400"/><circle cx="800" cy="520" r="470"/></g>
<rect width="1600" height="1000" fill="#071010" opacity="0.18"/>
</svg>
