<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Woodward Software Labs mark">
  <defs>
    <linearGradient id="wslGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <linearGradient id="wslBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#04060F"/>
    </linearGradient>
    <filter id="wslGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#wslBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#wslGrad)" stroke-opacity="0.35" stroke-width="4"/>
  <!-- circuit W -->
  <g filter="url(#wslGlow)">
    <path d="M118 152 L186 362 L256 208 L326 362 L394 152"
          fill="none" stroke="url(#wslGrad)" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- circuit nodes -->
  <circle cx="118" cy="152" r="18" fill="#00E5FF"/>
  <circle cx="394" cy="152" r="18" fill="#FF4ECD"/>
  <circle cx="256" cy="208" r="14" fill="#7C5CFF"/>
  <!-- data trace -->
  <path d="M394 152 L436 152 L436 110" fill="none" stroke="#FF4ECD" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
  <path d="M118 152 L76 152 L76 110" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
</svg>
